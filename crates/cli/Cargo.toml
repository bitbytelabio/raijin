[package]
name = "cli"
description = "Runs Burp Suite with Raijin per target, serves a stdio MCP gateway, and reads .burp projects offline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "raijin"
path = "src/main.rs"

[dependencies]
agent-browser.workspace = true
anyhow.workspace = true
base64.workspace = true
bproj.workspace = true
clap.workspace = true
futures.workspace = true
getrandom.workspace = true
gix = { workspace = true, features = ["blocking-http-transport-reqwest-rust-tls", "sha1"] }
glob.workspace = true
nix = { workspace = true, features = ["signal", "process", "user", "fs"] }
playwright-rs.workspace = true
regex.workspace = true
regex-syntax.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
rmcp = { workspace = true, features = ["server", "transport-io", "schemars"] }
rustls.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
similar.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "process", "io-std", "io-util", "sync", "fs"] }
toml.workspace = true
url.workspace = true
zip = { workspace = true, features = ["deflate"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["net"] }

[lints]
workspace = true
