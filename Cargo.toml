[workspace]
members = ["crates/bproj", "crates/cli"]
resolver = "3"

[workspace.package]
# Equals `version` in build.gradle.kts (the release workflow checks it).
version = "3.0.0"
edition = "2024"
rust-version = "1.100"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bproj = { path = "crates/bproj" }
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
getrandom = "0.3"
gix = { version = "0.91", default-features = false }
glob = "0.3"
memchr = "2.8"
nix = "0.32"
regex = "1.13"
regex-syntax = "0.8"
reqwest = { version = "0.13", default-features = false }
rmcp = "3.12"
schemars = "1.2"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
similar = "3.2"
tempfile = "3"
thiserror = "2.0"
tokio = "1.54"
toml = "1.2"
url = "2.5"
zip = { version = "9.8", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
strip = "symbols"
