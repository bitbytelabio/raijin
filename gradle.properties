kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m

# NOTE: do not set `org.gradle.java.home` here. Hardcoding an absolute JDK path
# breaks the build on any machine without that exact path (it previously pinned a
# Linux-only path, so Windows/macOS clones failed instantly). The build instead
# compiles with a JDK 25 toolchain (`jvmToolchain(25)` in build.gradle.kts), and
# gradle/gradle-daemon-jvm.properties runs the Gradle daemon on JDK 25, so `./gradlew`
# relaunches the build under JDK 25 whatever your default `java` is. Gradle finds an
# installed JDK 25 on any OS; if it does not, point JAVA_HOME at one before building:
#   Linux/macOS : export JAVA_HOME=/path/to/jdk-25
#   Windows     : set JAVA_HOME=C:\path\to\jdk-25
