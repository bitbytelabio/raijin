kotlin.code.style=official
org.gradle.jvmargs=-Xmx2048m

# NOTE: do not set `org.gradle.java.home` here. Hardcoding an absolute JDK path
# breaks the build on any machine without that exact path (it previously pinned a
# Linux-only path, so Windows/macOS clones failed instantly). The build instead
# compiles with a JDK 21 toolchain (`jvmToolchain(21)` in build.gradle.kts), and
# gradle/gradle-daemon-jvm.properties runs the Gradle daemon on JDK 21, so `./gradlew`
# relaunches the build under JDK 21 even when your default `java` is newer (e.g. Burp's
# bundled Java 25). Gradle finds an installed JDK 21 on any OS; if it does not, point
# JAVA_HOME at one before building:
#   Linux/macOS : export JAVA_HOME=/path/to/jdk-21
#   Windows     : set JAVA_HOME=C:\path\to\jdk-21
