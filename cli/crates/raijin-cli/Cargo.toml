[package]
name = "raijin-cli"
description = "Runs Burp Suite with Raijin per target, serves a stdio MCP gateway, and reads .burp projects offline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "raijin"
path = "src/main.rs"

[dependencies]
amber = { path = "../amber" }
anyhow = "1"
base64.workspace = true
clap.workspace = true
glob = "0.3"
nix = { version = "0.32", features = ["signal", "process", "user", "fs"] }
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.11", features = ["server", "transport-io", "schemars"] }
schemars = "1.2"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
similar = "3.2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time", "process", "io-std", "sync", "fs"] }
toml = "1.2"
url.workspace = true
zip = { version = "9.8", default-features = false, features = ["deflate"] }
getrandom.workspace = true
futures = "0.3"

[dev-dependencies]
rmcp = { version = "3.11", features = ["client", "transport-child-process"] }
tempfile = "3"

[lints]
workspace = true
