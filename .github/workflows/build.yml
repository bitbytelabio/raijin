name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a build still running.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Raijin targets Java 25 bytecode. CI pins JDK 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build + test
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Test
        run: cargo test --locked

      # --no-deps -p raijin-cli: crates/amber is vendored verbatim (see NOTICE) and is not held
      # to clippy lints newer than its upstream.
      - name: Clippy
        run: cargo clippy --locked -p raijin-cli --no-deps --all-targets -- -D warnings

  # install.sh runs under any POSIX sh (`curl ... | sh`). The download path is smoke-tested by
  # release.yml against the published assets: releases up to 2.2.1 carry no CLI archives.
  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck -s sh install.sh
