name: release

# Push a tag like v1.2.3 to build raijin.jar and publish a GitHub release.
# The tag must match `version` in build.gradle.kts, and CHANGELOG.md should have a
# `## 1.2.3` section: it becomes the release notes. Tags with a hyphen (v1.3.0-rc1)
# are published as pre-releases.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v1.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      jar_sha256: ${{ steps.package.outputs.jar_sha256 }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches the Gradle version
        run: |
          chmod +x ./gradlew
          version=$(./gradlew properties -q --no-daemon | sed -n 's/^version: //p')
          echo "Gradle version: $version, tag: $TAG"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match version $version in build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build + test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Package assets
        id: package
        run: |
          mkdir dist
          cp build/libs/raijin.jar "dist/raijin-$VERSION.jar"
          (cd dist && sha256sum "raijin-$VERSION.jar" > "raijin-$VERSION.jar.sha256")
          cp install.sh dist/install.sh
          echo "jar_sha256=$(cut -d' ' -f1 "dist/raijin-$VERSION.jar.sha256")" >> "$GITHUB_OUTPUT"

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          # Relative links (docs/..., docs/...#anchor) do not resolve on the release page: point them at
          # the tag, keeping the anchor. '|' delimits the expression because '#' appears inside it.
          sed -i -E "s|\]\(([^)#:]+)(#[^)]*)?\)|](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/\1\2)|g" notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No '## $VERSION' section in CHANGELOG.md; using generated notes only"
          fi
          cat >> notes.md <<EOF

          ## Install

          1. Download \`raijin-$VERSION.jar\` below (check it against the \`.sha256\` file).
          2. In Burp Suite 2026.2 or newer, running on Java 25 or newer: **Extensions → Installed → Add → Java →** select the jar.
          3. Connect your MCP client: \`claude mcp add --transport http burpsuite http://127.0.0.1:9876/mcp\`

          CLI: \`curl -LsSf https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh | RAIJIN_VERSION=$VERSION sh\` (installs \`raijin\` and \`raijin.jar\` into \`~/.local/bin\`), then \`raijin init\` in your target folder (or download \`raijin-cli-$VERSION-<target>.tar.gz\` manually).
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Raijin $VERSION" \
              --notes-file notes.md \
              --generate-notes \
              --verify-tag \
              "${flags[@]}"
          fi

  cli:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check tag matches the CLI version
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "CLI version: $version, tag: $TAG"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match [workspace.package] version $version in Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The CLI checks the jar it downloads against this digest of the jar the release job built.
      - name: Build
        env:
          RAIJIN_JAR_SHA256: ${{ needs.release.outputs.jar_sha256 }}
        run: |
          if [ -z "$RAIJIN_JAR_SHA256" ]; then
            echo "::error::the release job did not report the jar digest"
            exit 1
          fi
          cargo build --release --locked -p cli --target ${{ matrix.target }}

      - name: Package
        run: |
          name="raijin-cli-$VERSION-${{ matrix.target }}.tar.gz"
          tar -czf "$name" -C "target/${{ matrix.target }}/release" raijin
          shasum -a 256 "$name" > "$name.sha256"
          echo "ASSET=$name" >> "$GITHUB_ENV"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

  # Runs the published one-liner against the assets just uploaded: download, checksum, extract.
  install-smoke:
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-15 ]
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Install with install.sh
        run: |
          version="${TAG#v}"
          curl -LsSf "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/install.sh" \
            | RAIJIN_VERSION="$version" RAIJIN_INSTALL_DIR="$RUNNER_TEMP/bin" sh
          "$RUNNER_TEMP/bin/raijin" --version | grep -Fx "raijin $version"
          unzip -l "$RUNNER_TEMP/bin/raijin.jar" catalog/tools.json
